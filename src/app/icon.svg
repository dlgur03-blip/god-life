<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background: Premium Black Circle -->
  <circle cx="50" cy="50" r="48" fill="#111111" />

  <!-- Gold Accent Ring -->
  <circle cx="50" cy="50" r="44" stroke="#c4983f" stroke-width="2" fill="none" />

  <!-- Core Symbol: Star/Spark (Gold) -->
  <path d="M50 18 L57 42 L80 50 L57 58 L50 82 L43 58 L20 50 L43 42 Z" fill="#c4983f" filter="url(#glow)" />

  <!-- Inner Detail (White) -->
  <circle cx="50" cy="50" r="5" fill="#ffffff" />

  <!-- Filters for Glow Effect -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>